name: Romantic Quote Short

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout romantic code
        uses: actions/checkout@v4
        with:
          ref: v3-motivation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Add guaranteed quote fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('romantic_simple.js')
          s = p.read_text(encoding='utf-8')
          marker = "  throw new Error('Could not generate a valid Tenglish romantic quote after 5 attempts.');"
          if marker not in s:
              raise SystemExit('Expected quote failure marker not found.')
          replacement = r'''  const FALLBACK_QUOTES = [
    {
      title: 'Nee Gurthuga',
      screen: 'Nuvvu naatho leni prathi kshanam nishabdanga gadichina, naa manasu maatram nee gurthulatho roju kothaga maatladutune untundi.',
      voice: 'నువ్వు నాతో లేని ప్రతి క్షణం నిశ్శబ్దంగా గడిచినా, నా మనసు మాత్రం నీ జ్ఞాపకాలతో రోజు కొత్తగా మాట్లాడుతూనే ఉంటుంది.',
      imageQuery: 'lonely person rainy window cinematic portrait'
    },
    {
      title: 'Oka Kshanam',
      screen: 'Kalisi gadipina aa chinna kshanam ippatiki naa manasulo nilichipoyi, enni rojulu gadichina malli ade anubhoothini gurtuchestundi.',
      voice: 'కలిసి గడిపిన ఆ చిన్న క్షణం ఇప్పటికీ నా మనసులో నిలిచిపోయి, ఎన్ని రోజులు గడిచినా మళ్ళీ అదే అనుభూతిని గుర్తుచేస్తుంది.',
      imageQuery: 'couple walking sunset silhouette warm cinematic'
    },
    {
      title: 'Mounamlo Maata',
      screen: 'Nuvvu emi cheppakapoyina nee kallalo kanipinchina aa chinna maata, naa manasulo enno rojulu cheragani gurthuga migilipoyindi.',
      voice: 'నువ్వు ఏమీ చెప్పకపోయినా నీ కళ్ళలో కనిపించిన ఆ చిన్న మాట, నా మనసులో ఎన్నో రోజులు చెరగని జ్ఞాపకంగా మిగిలిపోయింది.',
      imageQuery: 'couple looking sunset cinematic portrait'
    },
    {
      title: 'Nee Kosam',
      screen: 'Dooram perigina koddi nee gurthulu maatram marinta daggaravutunnayi, ninnu kalavaleni prathi roju nee kosam naa manasu marinta eduruchustundi.',
      voice: 'దూరం పెరిగిన కొద్దీ నీ జ్ఞాపకాలు మాత్రం మరింత దగ్గరవుతున్నాయి, నిన్ను కలవలేని ప్రతి రోజు నీ కోసం నా మనసు మరింత ఎదురుచూస్తుంది.',
      imageQuery: 'person waiting by window evening cinematic'
    }
  ];
  const fallback = FALLBACK_QUOTES[runCount % FALLBACK_QUOTES.length];
  const fallbackCheck = validate(fallback.screen, fallback.voice);
  if (!fallbackCheck.valid) throw new Error('Guaranteed fallback failed validation: ' + fallbackCheck.problems.join(' | '));
  log('Groq did not produce a valid quote after 5 attempts; using curated original fallback.');
  return fallback;'''
          p.write_text(s.replace(marker, replacement), encoding='utf-8')
          PY

      - name: Verify source after fallback injection
        run: node --check romantic_simple.js

      - name: Generate and upload
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node romantic_simple.js

      - name: Save state to romantic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-article.json
          git diff --staged --quiet || git commit -m "Update romantic quote state [skip ci]"
          git push origin HEAD:v3-motivation
