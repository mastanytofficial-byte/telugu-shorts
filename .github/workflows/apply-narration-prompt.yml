name: Apply narration prompt update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: add one-time narration prompt patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply narration prompt patch
        run: |
          git apply .github/narration-prompt.patch
          rm .github/narration-prompt.patch
          rm .github/workflows/apply-narration-prompt.yml
          node --check index.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/narration-prompt.patch .github/workflows/apply-narration-prompt.yml
          git commit -m "chore: improve Telugu Shorts narration prompts"
          git push
