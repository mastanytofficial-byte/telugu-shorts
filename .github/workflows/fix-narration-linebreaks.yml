name: Fix narration pacing final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix narration pacing final')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          lines = s.splitlines()
          found = False
          for i, line in enumerate(lines):
              if "script = script.replace(" in line and "replace(/\\s+/g, ' ')" in line:
                  lines[i] = "  script = script.replace(/\\[[A-Z]+\\]/g, '').replace(/[ \\t]+/g, ' ').replace(/\\n{3,}/g, '\\n\\n').trim();"
                  found = True
                  break
          if not found:
              raise SystemExit('Could not find script whitespace-flattening line; refusing partial edit.')
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')

          replacements = [
            (
              "const parts = protectedText.split(/(?<=\\.)\\s*/);",
              "const parts = protectedText.split(/(?<=\\.)\\s*|\\n+/);"
            ),
            (
              "return fixed.join(' ').replace(/\\s+/g, ' ').trim().split(ELLIPSIS_PLACEHOLDER).join('...');",
              "return fixed.join('\\n').replace(/[ \\t]+/g, ' ').replace(/\\n{3,}/g, '\\n\\n').trim().split(ELLIPSIS_PLACEHOLDER).join('...');"
            ),
            (
              "const optimized = (await callLLM(punctPrompt)).trim();\n    if (optimized && wordsPreserved(script, optimized)) {\n      script = optimized;",
              "const optimized = (await callLLM(punctPrompt)).trim();\n    const originalLineCount = script.split(/\\n+/).filter(Boolean).length;\n    const optimizedLineCount = optimized.split(/\\n+/).filter(Boolean).length;\n    if (optimized && wordsPreserved(script, optimized) && optimizedLineCount === originalLineCount) {\n      script = optimized;"
            ),
            (
              "script = (script.trim() + ' ' + ctaSentence).trim();",
              "// Spoken CTA is intentionally disabled. The video already has a visual CTA button;\n  // narration should end on the fact's strongest takeaway, not a templated subscription line.\n  script = script.trim();"
            ),
            (
              "- Narration ఒక paragraph లాగా ఉండకూడదు. 12-18 short spoken lines గా ఆలోచించు.\n- సాధారణంగా ఒక్క line 2-10 తెలుగు పదాలు ఉండాలి; అవసరమైనప్పుడు కొంచెం పొడవైన line మాత్రమే వాడు.\n- ఒకే sentence లో అనేక facts ని cram చేయవద్దు.",
              "- Narration ఒక paragraph లాగా ఉండకూడదు. ఖచ్చితంగా 12-18 short spoken lines గా రాయి.\n- ప్రతి line ఒక ప్రత్యేకమైన, సహజమైన spoken beat కావాలి; సాధారణంగా 2-10 తెలుగు పదాలు.\n- Line break ను punctuation కంటే ముఖ్యమైన pacing signal గా భావించు. ప్రతి line ను కొత్త visual/voice beat లాగా రాయి.\n- ఒక line లో ఒక్క grammatical thought మాత్రమే ఉండాలి. Commaలతో 3-4 clauses ని ఒకే sentence లో కలపవద్దు.\n- Fragment కావాల్సిన suspense lines మాత్రమే fragment గా ఉండొచ్చు; మిగతా lines సహజమైన పూర్తి తెలుగు వాక్యాలుగా ఉండాలి."
            ),
            (
              "- Large numbers ని digits/comma format లో కాకుండా సహజమైన తెలుగు మాటల్లో రాయడానికి ప్రయత్నించు (ఉదా: 3,000 → మూడు వేల).",
              "- ASCII digits అసలు వాడవద్దు. అన్ని సంఖ్యలను సహజమైన తెలుగు మాటల్లోనే రాయి. ఉదా: 2000 → రెండు వేల, 19వ శతాబ్దం → పంతొమ్మిదో శతాబ్దం, 3,000 → మూడు వేల.\n- Source లో 'some', 'certain', 'may', 'can' వంటి పరిమితి ఉంటే narration లో దాన్ని 'అన్నీ', 'ఎప్పుడూ', 'ఖచ్చితంగా' అని overclaim చేయవద్దు."
            ),
            (
              "- Source fact లో ఉన్న terminology ని తప్పుగా simplify చేయవద్దు.",
              "- Source fact లో ఉన్న terminology ని తప్పుగా simplify చేయవద్దు.\n- Technical term అవసరమైతే మాత్రమే English/technical word వాడు; Telugu sentence లో random English words కలపవద్దు.\n- Fact యొక్క core claim ని మార్చవద్దు: ఉదాహరణకు refining/filtering process ని 'ఆ పదార్థంతో తయారవుతుంది' అని చెప్పవద్దు."
            ),
            (
              "- Telugu script మాత్రమే; Romanized Telugu వద్దు.\n- CTA, title, labels, emoji, markdown వద్దు.",
              "- Telugu script మాత్రమే; Romanized Telugu వద్దు.\n- CTA, title, labels, emoji, markdown వద్దు.\n- Final answer పంపే ముందు silently grammar, natural spoken Telugu, factual scope, number formatting, మరియు line-by-line pacing check చేయి.\n- Script చివరి line fact-specific memorable takeaway కావాలి; generic moral లేదా subscribe request వద్దు."
            ),
            (
              "- **పదాలు ఒక్కటి కూడా జోడించకు, తీసేయకు, మార్చకు** — కేవలం punctuation (., ,, ...) మరియు line breaks మాత్రమే మార్చు",
              "- **ఏ line merge చేయకు, ఏ line split చేయకు. Original line breaks సంఖ్య మరియు క్రమం తప్పనిసరిగా అలాగే ఉంచు.**\n- పదాలు ఒక్కటి కూడా జోడించకు, తీసేయకు, మార్చకు — కేవలం punctuation మాత్రమే మార్చు."
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Required source text not found; refusing partial edit:\n' + old[:180])
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check index.js
          git diff --check
          rm -f .github/workflows/fix-narration-linebreaks.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows/fix-narration-linebreaks.yml
          git commit -m "chore: apply narration pacing fixes"
          git push