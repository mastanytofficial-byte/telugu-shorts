name: Apply narration prompt update v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'narration prompt')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch and validate
        run: |
          git apply .github/narration-prompt.patch
          node --check index.js
          rm .github/narration-prompt.patch
          rm .github/workflows/apply-narration-prompt.yml
          rm .github/workflows/apply-narration-prompt-v2.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/narration-prompt.patch .github/workflows/apply-narration-prompt.yml .github/workflows/apply-narration-prompt-v2.yml
          git commit -m "chore: improve Telugu Shorts narration prompts"
          git push
