name: Daily Telugu News Short

on:
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: daily-video-main
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Cache ffmpeg apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          # Only the .deb files, not the whole archives dir — `lock` and `partial/`
          # in there are root-owned and made the cache-save step fail (permission
          # denied trying to tar them) on the first run this was added.
          path: /var/cache/apt/archives/*.deb
          key: apt-ffmpeg-${{ runner.os }}-v1

      - name: Ensure ffmpeg and ffprobe are available
        shell: bash
        timeout-minutes: 15
        run: |
          set -uo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo 'System ffmpeg and ffprobe already available.'
          else
            echo 'Installing ffmpeg package (provides both ffmpeg and ffprobe)...'
            # The Ubuntu archive mirror GitHub-hosted runners land on can occasionally
            # be very slow or stall entirely (seen hanging 8+ minutes on one package).
            # A per-attempt `timeout` caps the damage from a stalled connection instead
            # of silently eating into the job's 60-minute budget, and the apt cache
            # above means most runs skip the network download altogether.
            install_ok=0
            for attempt in 1 2 3; do
              echo "apt-get install attempt ${attempt}/3..."
              if timeout 240 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                 && timeout 240 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg; then
                install_ok=1
                break
              fi
              echo "Attempt ${attempt} failed or timed out; retrying with backoff..."
              sleep $((attempt * 15))
            done
            if [ "$install_ok" -ne 1 ]; then
              echo 'ffmpeg install failed after 3 attempts.'
              exit 1
            fi
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate automation source
        run: |
          node --check runtime_llm_router.js
          node --check index.js
          node --check narration_quality_guard_v14.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Generate and upload video
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm start

      - name: Save rotation and duplicate-prevention state
        shell: bash
        run: |
          set -euo pipefail
          test -f state.json || { echo 'state.json was not generated'; exit 1; }
          test -f last-article.json || { echo 'last-article.json was not generated'; exit 1; }
          cp state.json /tmp/state.json.generated
          cp last-article.json /tmp/last-article.json.generated
          for attempt in 1 2 3 4 5; do
            echo "Saving state (attempt ${attempt}/5)..."
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/state.json.generated state.json
            cp /tmp/last-article.json.generated last-article.json
            git add state.json last-article.json
            if git diff --cached --quiet; then
              echo 'No state change to commit.'
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Persist category topic and duplicate-prevention state [skip ci]"
            if git push origin HEAD:main; then
              echo 'Rotation and duplicate-prevention state saved successfully.'
              exit 0
            fi
            echo 'Push raced with another update; retrying from latest main...'
            git reset --hard origin/main
            sleep $((attempt * 2))
          done
          echo 'Failed to save state after 5 attempts.'
          exit 1
