name: Daily Telugu News Short

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST every day (3:30 UTC)
  workflow_dispatch: {}     # allows manual "Run workflow" button too

permissions:
  contents: write

concurrency:
  group: daily-video-main
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg is available
        run: ffmpeg -version

      - name: Install dependencies
        run: npm install

      - name: Validate automation patch files
        run: |
          node --check quality_patch.js
          node --check quality_patch_v4.js
          node --check quality_patch_v6.js
          node --check quality_patch_v7.js
          node --check quality_patch_v8.js
          node --check index.js

      - name: Generate and upload video
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: npm start

      - name: Save state (avoid duplicate news next run)
        shell: bash
        run: |
          set -euo pipefail
          test -f last-article.json || { echo 'last-article.json was not generated'; exit 1; }
          cp last-article.json /tmp/last-article.json.generated

          for attempt in 1 2 3 4 5; do
            echo "Saving state (attempt ${attempt}/5)..."
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/last-article.json.generated last-article.json
            git add last-article.json

            if git diff --cached --quiet; then
              echo 'No state change to commit.'
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update last used article [skip ci]"

            if git push origin HEAD:main; then
              echo 'State saved successfully.'
              exit 0
            fi

            echo 'Push raced with another update; retrying from latest main...'
            git reset --hard origin/main
            sleep $((attempt * 2))
          done

          echo 'Failed to save state after 5 attempts.'
          exit 1
