name: Daily Telugu Amazing Facts Short

on:
  schedule:
    - cron: '30 3 * * *'    # 9:00 AM IST every day (3:30 UTC)
    - cron: '30 13 * * *'   # 7:00 PM IST every day (13:30 UTC)
  workflow_dispatch: {}     # allows manual "Run workflow" button too

# Queues overlapping runs instead of letting them execute in parallel —
# prevents the state.json git-push race condition at its source (two runs
# both reading the same categoryRunCounts, one push winning and silently
# discarding the other's increment, causing an outline to repeat sooner
# than intended). Never cancels an in-progress run — it just waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: Install ffmpeg
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present on this runner, skipping install."
            ffmpeg -version
          else
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Verify ffmpeg is available
        timeout-minutes: 1
        run: ffmpeg -version

      - name: Install dependencies
        timeout-minutes: 3
        run: npm install

      - name: Install Python bridge for experimental HF Space video tier
        timeout-minutes: 2
        continue-on-error: true  # optional tier — pipeline works fine without it
        run: pip install --break-system-packages gradio_client

      - name: Generate and upload video
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node debug.js human_body

      - name: Save state (avoid duplicate facts next run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "State pushed successfully (attempt $i)."
              exit 0
            fi
            echo "Push failed (attempt $i/5) — likely a concurrent run (we now run 2x/day). Pulling latest and retrying..."
            git pull --rebase -X theirs origin main
            sleep $((5 * i))
          done
          echo "::error::Failed to push state after 5 attempts — next run may reuse an outline sooner than intended, but the video itself uploaded fine."
          exit 1
