name: Daily Telugu Amazing Facts Short

on:
  schedule:
    - cron: '30 3 * * *'    # 9:00 AM IST every day (3:30 UTC)
    - cron: '30 13 * * *'   # 7:00 PM IST every day (13:30 UTC)
  workflow_dispatch: {}     # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: Install ffmpeg
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify ffmpeg is available
        timeout-minutes: 1
        run: ffmpeg -version

      - name: Install dependencies
        timeout-minutes: 3
        run: npm install

      - name: Install Python bridge for experimental HF Space video tier
        timeout-minutes: 2
        continue-on-error: true  # optional tier — pipeline works fine without it
        run: pip install --break-system-packages gradio_client

      - name: Generate and upload video
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node index.js

      - name: Save state (avoid duplicate facts next run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
