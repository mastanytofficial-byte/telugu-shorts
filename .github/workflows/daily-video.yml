name: Daily Telugu Romantic Quote Short

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST every day (3:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: Install ffmpeg
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify ffmpeg is available
        timeout-minutes: 1
        run: ffmpeg -version

      - name: Install dependencies
        timeout-minutes: 3
        run: npm install

      - name: Apply romantic quote validation patch
        run: git apply romantic-quote-validation.patch

      - name: Verify Node.js syntax
        timeout-minutes: 1
        run: node --check index.js

      - name: Generate and upload romantic quote video
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node index.js

      - name: Save quote state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-article.json
          git diff --staged --quiet || git commit -m "Update romantic quote state [skip ci]"
          git push
