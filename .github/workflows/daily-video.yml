name: Daily Telugu Romantic Quote Short

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-romantic-main
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout romantic branch
        uses: actions/checkout@v4
        with:
          ref: v3-motivation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify ffmpeg is available
        run: ffmpeg -version

      - name: Install dependencies
        run: npm install

      - name: Add reliable quote fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('romantic_simple.js')
          s = p.read_text(encoding='utf-8')
          marker = "  throw new Error('Could not generate a valid Tenglish romantic quote after 5 attempts.');"
          if marker not in s:
              raise SystemExit('Quote failure marker not found; refusing to continue.')
          replacement = """  const fallback = {\n    title: 'Nee Gurthuga',\n    screen: 'Nuvvu naatho leni prathi kshanam nishabdanga gadichina, naa manasu maatram nee gurthulatho roju kothaga maatladutune untundi, ninnu taluchukuntu.',\n    voice: 'నువ్వు నాతో లేని ప్రతి క్షణం నిశ్శబ్దంగా గడిచినా, నా మనసు మాత్రం నీ జ్ఞాపకాలతో రోజు కొత్తగా మాట్లాడుతూనే ఉంటుంది, నిన్ను తలుచుకుంటూ.',\n    imageQuery: 'lonely person rainy window cinematic portrait'\n  };\n  const fallbackCheck = validate(fallback.screen, fallback.voice);\n  if (!fallbackCheck.valid) throw new Error('Fallback quote failed validation: ' + fallbackCheck.problems.join(' | '));\n  log('Groq did not produce a valid quote after 5 attempts; using curated original fallback.');\n  return fallback;"""
          p.write_text(s.replace(marker, replacement), encoding='utf-8')
          PY

      - name: Verify romantic pipeline syntax
        run: node --check romantic_simple.js

      - name: Generate and upload romantic quote video
        timeout-minutes: 12
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node romantic_simple.js

      - name: Save quote state to romantic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-article.json
          git diff --staged --quiet || git commit -m "Update romantic quote state [skip ci]"
          git push origin HEAD:v3-motivation
