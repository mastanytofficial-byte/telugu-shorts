name: Fix sentence split final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix sentence split final')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix line-aware sentence splitting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')
          old = "  const parts = protectedText.split(/(?<=\\.)\\s*/).map(s => s.trim()).filter(Boolean);"
          new = "  const parts = protectedText.split(/(?<=\\.)\\s*|\\n+/).map(s => s.trim()).filter(Boolean);"
          if old not in s:
              raise SystemExit('Expected splitIntoSentences line was not found; refusing partial edit.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check index.js
          git diff --check
          rm -f .github/workflows/fix-sentence-split.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows/fix-sentence-split.yml
          git commit -m "chore: apply line-aware sentence splitting"
          git push