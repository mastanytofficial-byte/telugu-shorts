name: Apply narration style patch v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch and validate
        run: |
          git apply --recount .github/narration-v4.patch
          node --check index.js
          git diff --check
          rm -f .github/narration-v4.patch
          rm -f .github/workflows/patch-narration-v4.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github
          git commit -m "chore: strengthen cinematic Telugu narration rhythm"
          git push